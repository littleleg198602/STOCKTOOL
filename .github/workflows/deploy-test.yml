name: Deploy test to FORPSI

# Manual-only: user deploys site/ via Deploy-StockTool.bat v3.
# DO NOT enable automatic push -> FTP: previous jobs failed repeatedly,
# flooding the repository owner with GitHub Actions failure emails.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stocktool-forpsi-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Upload /test/ via FTPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP for syntax checks
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none

      - name: Check website syntax without running analyses
        run: |
          for file in site/johny/api/*.php; do php -l "$file"; done
          node --check site/johny/app.js

      - name: Publish test website
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpx.forpsi.com
          username: f0476608.multi
          password: ${{ secrets.FORPSI_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./site/
          server-dir: /stocktool.eu/www/test/
          log-level: standard
