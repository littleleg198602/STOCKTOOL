name: JOHNY - checks

on:
  pull_request:
    paths: ['market_checker_app/**', 'scripts/stocktool_score.py', 'tests/**', 'site/johny/**', 'requirements-score.txt', '.github/workflows/johny-*.yml']
  push:
    paths: ['market_checker_app/**', 'scripts/stocktool_score.py', 'tests/**', 'site/johny/**', 'requirements-score.txt', '.github/workflows/johny-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-score.txt
            market_checker_app/requirements.txt
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - run: python -m pip install -r requirements-score.txt -r market_checker_app/requirements.txt
      - name: Compile Python and run regression and HTTP integration tests
        run: |
          python -m compileall -q market_checker_app scripts/stocktool_score.py
          python -m unittest discover -s tests -v
      - name: PHP and browser JavaScript syntax
        run: |
          for file in site/johny/api/*.php; do php -l "$file"; done
          node --check site/johny/app.js
