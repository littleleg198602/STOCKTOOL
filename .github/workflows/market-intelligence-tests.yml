name: Market Intelligence checks

on:
  push:
    paths:
      - 'site/market-intelligence/**'
      - 'tests/market_intelligence_test.php'
      - 'tests/calendar_v2_test.cjs'
      - 'tests/calendar_v2_ui_test.cjs'
      - '.github/workflows/market-intelligence-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intelligence:
    name: Economic source parsers, timezone safety and client syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PHP syntax
        run: |
          php -l site/market-intelligence/api/source_lib.php
          php -l site/market-intelligence/api/overview.php
          php -l tests/market_intelligence_test.php
      - name: Offline source and economic calendar tests
        run: php tests/market_intelligence_test.php
      - name: JavaScript syntax
        run: |
          node --check site/market-intelligence/app.js
          node --check site/market-intelligence/calendar-core.js
          node --check site/market-intelligence/calendar-v2.js
          node tests/calendar_v2_test.cjs
          node tests/calendar_v2_ui_test.cjs
